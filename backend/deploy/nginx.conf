# /etc/nginx/sites-available/dev-tracker-api
# Reverse proxy for the API. Replace api.example.com, then run
#   sudo ln -s /etc/nginx/sites-available/dev-tracker-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.example.com
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Gemini plan generation can take a while.
        proxy_read_timeout 90s;
    }
}
